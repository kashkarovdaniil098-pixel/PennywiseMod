
name: Build Pennywise Mod

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'

      - name: Add Stardew reference assemblies
        uses: Pathoschild/SMAPI-ModBuildWorkflow/add-reference-assemblies@v1
        with:
          repository: StardewModders/mod-reference-assemblies
          ref: main

      - name: Build mod
        run: dotnet build PennywiseMod.csproj -c Release

      - name: Upload mod
        uses: actions/upload-artifact@v4
        with:
          name: PennywiseMod
          path: bin/Release/net6.0/
